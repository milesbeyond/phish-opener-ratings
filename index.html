<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phish Song Position vs. Average Show Rating</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .viz-root {
    --page-plane:      #f9f9f7;
    --surface-1:       #fcfcfb;
    --text-primary:    #0b0b0b;
    --text-secondary:  #52514e;
    --text-muted:      #898781;
    --gridline:        #e1e0d9;
    --baseline:        #c3c2b7;
    --border:          rgba(11, 11, 11, 0.10);
    --tooltip-bg:      #0b0b0b;
    --tooltip-text:    #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page-plane:      #0d0d0d;
      --surface-1:       #1a1a19;
      --text-primary:    #ffffff;
      --text-secondary:  #c3c2b7;
      --text-muted:      #898781;
      --gridline:        #2c2c2a;
      --baseline:        #383835;
      --border:          rgba(255, 255, 255, 0.10);
      --tooltip-bg:      #ffffff;
      --tooltip-text:    #0b0b0b;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page-plane:      #0d0d0d;
    --surface-1:       #1a1a19;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --text-muted:      #898781;
    --gridline:        #2c2c2a;
    --baseline:        #383835;
    --border:          rgba(255, 255, 255, 0.10);
    --tooltip-bg:      #ffffff;
    --tooltip-text:    #0b0b0b;
  }

  .viz-root {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 24px 56px;
  }
  .viz-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px 28px 20px;
  }
  .viz-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text-primary);
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 20px;
    line-height: 1.5;
  }
  .theme-toggle {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text-primary); }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 20px;
    flex-wrap: wrap;
  }
  .controls-row label {
    font-size: 12.5px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .metric-select {
    font-size: 13px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .controls-row .vs {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .chart-grid {
    display: grid;
    grid-template-columns: 240px 1fr 44px;
    column-gap: 10px;
    row-gap: 3px;
  }
  .row-label {
    grid-column: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    text-align: right;
    font-size: 12.5px;
    color: var(--text-primary);
    line-height: 1.25;
    padding: 2px 0;
  }
  .row-track {
    grid-column: 2;
    position: relative;
    display: flex;
    align-items: center;
    min-height: 20px;
  }
  .bar {
    height: 20px;
    border-radius: 0 4px 4px 0;
    transition: filter 120ms ease;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
  }
  .bar .bar-inline-label {
    font-size: 10.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding-right: 8px;
    white-space: nowrap;
  }
  .row-track:hover .bar,
  .row-track:focus-visible .bar {
    filter: brightness(1.12);
  }
  .row-track:focus-visible {
    outline: 2px solid var(--text-primary);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 22px;
  }
  .legend-title {
    font-size: 11.5px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .legend-scale {
    position: relative;
    flex: 1 1 auto;
    max-width: 320px;
  }
  .legend-gradient {
    height: 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
  }
  .legend-ticks {
    position: relative;
    height: 16px;
    margin-top: 3px;
  }
  .legend-ticks span {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-size: 10.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .legend-ticks span:first-child { transform: translateX(0); }
  .legend-ticks span:last-child { transform: translateX(-100%); }
  .row-value {
    grid-column: 3;
    display: flex;
    align-items: center;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    padding: 2px 0;
  }

  .gridlines {
    grid-column: 2;
    grid-row: 1 / -1;
    position: relative;
    pointer-events: none;
  }
  .gridlines .line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--gridline);
  }
  .gridlines .line.baseline { background: var(--baseline); }

  .axis-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 240px 1fr 44px;
    column-gap: 10px;
    margin-top: 6px;
  }
  .axis-ticks {
    grid-column: 2;
    position: relative;
    height: 18px;
  }
  .axis-ticks span {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .axis-ticks span:first-child { transform: translateX(0); }
  .axis-ticks span:last-child { transform: translateX(-100%); }
  .axis-title {
    grid-column: 2;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--tooltip-bg);
    color: var(--tooltip-text);
    font-size: 12px;
    border-radius: 6px;
    padding: 6px 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transform: translate(-50%, calc(-100% - 10px));
    transition: opacity 100ms ease;
    z-index: 10;
    white-space: nowrap;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-value {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .tooltip .tt-label {
    opacity: 0.8;
    margin-left: 6px;
  }

  details.table-toggle {
    margin-top: 22px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  summary {
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
  }
  summary:hover { color: var(--text-primary); }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 12.5px;
  }
  table caption { text-align: left; font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
  th, td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--gridline);
  }
  th:not(:first-child), td:not(:first-child) {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  th { color: var(--text-secondary); font-weight: 600; }
  td { color: var(--text-primary); }

  footer.note {
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }
</style>
</head>

</div>

  };

  const domainMax = 5;
  const ratingTicks = [0, 1, 2, 3, 4, 5];
  const grid = document.getElementById('chartGrid');
  const gridlines = document.getElementById('gridlines');
  const axisTicks = document.getElementById('axisTicks');
  const tooltip = document.getElementById('tooltip');
  const tableBody = document.querySelector('#dataTable tbody');
  const legendGradient = document.getElementById('legendGradient');
  const legendTicks = document.getElementById('legendTicks');
  const legendTitle = document.getElementById('legendTitle');
  const subtitleEl = document.getElementById('subtitle');
  const footerEl = document.getElementById('footerNote');
  const tableCountHeader = document.getElementById('tableCountHeader');
  const metricSelect = document.getElementById('metricSelect');

  // Sequential "volume" ramp (times in position): one hue, light -> dark,
  // from the skill's documented palette (palette.md, blue sequential steps
  // 100-700).
  const VOLUME_RAMP = [
    '#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7',
    '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95', '#104281', '#0d366b',
  ];
  const INK_LIGHT = [255, 255, 255];
  const INK_DARK = [11, 11, 11];

  const hexToRgb = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const rgbToHex = ([r, g, b]) =>
    '#' + [r, g, b].map((c) => Math.round(c).toString(16).padStart(2, '0')).join('');
  const lerpRgb = (a, b, frac) => [
    a[0] + (b[0] - a[0]) * frac,
    a[1] + (b[1] - a[1]) * frac,
    a[2] + (b[2] - a[2]) * frac,
  ];
  const colorForT = (t) => {
    const clamped = Math.max(0, Math.min(1, t));
    const position = clamped * (VOLUME_RAMP.length - 1);
    const i0 = Math.floor(position);
    const i1 = Math.min(i0 + 1, VOLUME_RAMP.length - 1);
    const frac = position - i0;
    return rgbToHex(lerpRgb(hexToRgb(VOLUME_RAMP[i0]), hexToRgb(VOLUME_RAMP[i1]), frac));
  };
  const relLuminance = ([r, g, b]) => {
    const toLinear = (c) => {
      const s = c / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    };
    const [rl, gl, bl] = [toLinear(r), toLinear(g), toLinear(b)];
    return 0.2126 * rl + 0.7152 * gl + 0.0722 * bl;
  };
  const contrastRatio = (rgbA, rgbB) => {
    const lA = relLuminance(rgbA), lB = relLuminance(rgbB);
    const [lighter, darker] = lA > lB ? [lA, lB] : [lB, lA];
    return (lighter + 0.05) / (darker + 0.05);
  };
  const pickInk = (fillRgb) =>
    contrastRatio(fillRgb, INK_LIGHT) >= contrastRatio(fillRgb, INK_DARK)
      ? 'rgb(255,255,255)'
      : 'rgb(11,11,11)';

  // Rating axis (0-5) and its gridlines never change between metrics.
  for (const t of ratingTicks) {
    const pct = (t / domainMax) * 100;
    const line = document.createElement('div');
    line.className = 'line' + (t === 0 ? ' baseline' : '');
    line.style.left = pct + '%';
    gridlines.appendChild(line);

    const span = document.createElement('span');
    span.style.left = pct + '%';
    span.textContent = t;
    axisTicks.appendChild(span);
  }

  for (const key of Object.keys(METRICS)) {
    const option = document.createElement('option');
    option.value = key;
    option.textContent = METRICS[key].label;
    metricSelect.appendChild(option);
  }

  function clearRows() {
    for (const el of [...grid.children]) {
      if (el.id !== 'gridlines') el.remove();
    }
    while (legendTicks.firstChild) legendTicks.removeChild(legendTicks.firstChild);
    while (tableBody.firstChild) tableBody.removeChild(tableBody.firstChild);
  }

  function renderChart(metricKey) {
    const metric = METRICS[metricKey];
    const data = DATASETS[metricKey];
    clearRows();

    subtitleEl.textContent =
      'Songs that have ' + metric.volumeLabel + ' in at least 10 Phish shows, ' +
      'ranked by the average rating of those shows. Bar color shows how often ' +
      'each song has ' + metric.volumeLabel +
      ' \u2014 the number inside each bar is the exact count.';
    footerEl.textContent =
      'Source: Phish.net setlist and show-rating data. Bar length shows the ' +
      'average user rating (0\u20135 scale) of shows where this song was the ' +
      metric.position + '; bar color shows volume (lighter = fewer, darker = ' +
      'more \u2014 see legend above). Shows flagged as non-standard (exclude) are ' +
      'omitted. Limited to songs appearing in this position 10 or more times.';
    legendTitle.textContent = 'Times ' + metric.volumeLabel;
    tableCountHeader.textContent = 'Times ' + metric.volumeLabel;
    grid.setAttribute(
      'aria-label',
      'Bar chart of average show rating for songs that were the ' + metric.label +
        ', colored by how often',
    );

    const volumeValues = data.map((d) => d.timesOpened);
    const volumeMin = Math.min(...volumeValues);
    const volumeMax = Math.max(...volumeValues);
    // Square-root scale: volume is heavily right-skewed (a few huge outliers
    // vs. a cluster of songs near the 10-open threshold), so a linear scale
    // would make most bars nearly indistinguishable in color.
    const volumeToT = (value) =>
      volumeMax === volumeMin
        ? 1
        : (Math.sqrt(value) - Math.sqrt(volumeMin)) / (Math.sqrt(volumeMax) - Math.sqrt(volumeMin));

    legendGradient.style.background =
      'linear-gradient(to right, ' + VOLUME_RAMP.join(', ') + ')';
    const legendMidValue =
      Math.round((((Math.sqrt(volumeMin) + Math.sqrt(volumeMax)) / 2) ** 2) / 5) * 5;
    const legendValues = legendMidValue > volumeMin && legendMidValue < volumeMax
      ? [volumeMin, legendMidValue, volumeMax]
      : [volumeMin, volumeMax];
    for (const v of legendValues) {
      const span = document.createElement('span');
      span.style.left = (volumeToT(v) * 100) + '%';
      span.textContent = v;
      legendTicks.appendChild(span);
    }

    gridlines.style.gridRow = '1 / ' + (data.length + 1);

    data.forEach((d, index) => {
      const rowLine = index + 1;

      const label = document.createElement('div');
      label.className = 'row-label';
      label.textContent = d.song;
      label.style.gridRow = String(rowLine);
      grid.appendChild(label);

      const track = document.createElement('div');
      track.className = 'row-track';
      track.style.gridRow = String(rowLine);
      track.tabIndex = 0;
      track.setAttribute('role', 'img');
      track.setAttribute(
        'aria-label',
        d.song + ': average rating ' + d.avgRating.toFixed(2) +
          ' over ' + d.timesOpened + ' shows',
      );

      const fillColor = colorForT(volumeToT(d.timesOpened));
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.width = (d.avgRating / domainMax * 100) + '%';
      bar.style.background = fillColor;
      const inlineLabel = document.createElement('span');
      inlineLabel.className = 'bar-inline-label';
      inlineLabel.style.color = pickInk(hexToRgb(fillColor));
      inlineLabel.textContent = d.timesOpened + ' shows';
      bar.appendChild(inlineLabel);
      track.appendChild(bar);
      grid.appendChild(track);

      const value = document.createElement('div');
      value.className = 'row-value';
      value.style.gridRow = String(rowLine);
      value.textContent = d.avgRating.toFixed(2);
      grid.appendChild(value);

      const showTip = (evt) => {
        const valueEl = tooltip.querySelector('.tt-value');
        const labelEl = tooltip.querySelector('.tt-label');
        valueEl.textContent = d.avgRating.toFixed(2) + ' avg';
        labelEl.textContent = d.song + ' \u00b7 ' + d.timesOpened + ' shows';
        const rect = track.getBoundingClientRect();
        const x = evt && evt.clientX ? evt.clientX : rect.left + bar.offsetWidth;
        tooltip.style.left = x + 'px';
        tooltip.style.top = rect.top + 'px';
        tooltip.classList.add('visible');
      };
      const hideTip = () => tooltip.classList.remove('visible');

      track.addEventListener('mousemove', showTip);
      track.addEventListener('mouseenter', showTip);
      track.addEventListener('mouseleave', hideTip);
      track.addEventListener('focus', showTip);
      track.addEventListener('blur', hideTip);

      const tr = document.createElement('tr');
      const tdSong = document.createElement('td');
      tdSong.textContent = d.song;
      const tdRating = document.createElement('td');
      tdRating.textContent = d.avgRating.toFixed(2);
      const tdCount = document.createElement('td');
      tdCount.textContent = d.timesOpened;
      tr.appendChild(tdSong);
      tr.appendChild(tdRating);
      tr.appendChild(tdCount);
      tableBody.appendChild(tr);
    });
  }

  function metricFromUrl() {
    const requested = new URLSearchParams(window.location.search).get('metric');
    return requested && METRICS[requested] ? requested : 'set1Opener';
  }

  const initialMetric = metricFromUrl();
  metricSelect.value = initialMetric;
  renderChart(initialMetric);

  metricSelect.addEventListener('change', () => {
    const key = metricSelect.value;
    renderChart(key);
    const url = new URL(window.location.href);
    url.searchParams.set('metric', key);
    window.history.replaceState(null, '', url);
  });

  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = current ? current === 'dark' : prefersDark;
    const next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    themeToggle.textContent = next === 'dark' ? 'Light mode' : 'Dark mode';
  });
</script>
